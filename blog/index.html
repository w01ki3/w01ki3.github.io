    <script>
        (function() {
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'sw.js?_=' + Date.now(), false);
                xhr.setRequestHeader('Cache-Control', 'no-cache');
                xhr.setRequestHeader('Pragma', 'no-cache');
                xhr.send();
                var match = xhr.responseText.match(/const APP_VERSION = ['"]([^'"]+)['"]/);
                window.APP_VERSION = (match && match[1]) || 'v0';
            } catch (e) {
                window.APP_VERSION = 'v0';
            }
            self.APP_VERSION = window.APP_VERSION;
            document.write('<link rel="stylesheet" href="style.css?v=' + window.APP_VERSION + '">');
        })();
    </script>
